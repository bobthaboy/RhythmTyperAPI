[project]
name = "rhythmtyperapi"
version = "0.1.5"
description = "Library for python to interact with RhythmTyper's endpoints."
authors = [
    {name = "bobthaboy"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2,<3.0.0"
]

[tool.poetry]
packages = [
    { include = "RhythmTyperAPI" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"